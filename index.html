<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>السلة الذكية | تسوق من الصين</title>
<style>
:root{--ink:#111827;--muted:#667085;--line:#e5e7eb;--accent:#d8ff42}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Arabic",sans-serif;color:var(--ink);background:#fafafa}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 6%;position:sticky;top:0;z-index:5}.brand{font-weight:800;font-size:20px}.brand b{background:var(--ink);color:#fff;border-radius:11px;padding:7px 11px;margin-left:8px}.account-btn,.cart-btn{border:0;border-radius:10px;padding:10px 14px;cursor:pointer;font-weight:700}.account-btn{background:#fff;border:1px solid var(--line)}.cart-btn{background:var(--ink);color:#fff}.hero{padding:85px 7%;background:radial-gradient(circle at 20% 20%,#e7efff,transparent 36%),#fff}.hero h1{font-size:clamp(32px,5vw,58px);margin:0 0 15px}.hero p{color:var(--muted);font-size:18px;line-height:1.8;max-width:700px}.search{display:flex;gap:8px;max-width:760px;margin-top:28px}.search input{flex:1;border:1px solid #dfe3e8;border-radius:14px;padding:16px;font-size:16px;min-width:0}.search button{background:var(--ink);color:#fff;border:0;border-radius:14px;padding:0 24px;font-weight:700;cursor:pointer}.hint{color:var(--muted);font-size:13px;margin-top:12px}.section{padding:55px 7%}.status{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(255px,1fr));gap:18px;margin-top:22px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden}.image{height:230px;background:#f3f4f6;display:grid;place-items:center;font-size:55px}.image img{width:100%;height:100%;object-fit:cover}.body{padding:16px}.source{color:#667085;font-size:12px}.body h3{font-size:16px;line-height:1.6}.price{font-size:21px;font-weight:800}.add{width:100%;margin-top:13px;border:0;border-radius:10px;background:var(--ink);color:#fff;padding:12px;cursor:pointer}.empty{padding:28px;background:#fff;border:1px dashed #cbd5e1;border-radius:16px}.drawer{position:fixed;inset:0 0 0 auto;width:min(420px,100%);background:#fff;box-shadow:-10px 0 40px #0002;padding:24px;display:none;z-index:9}.drawer.open{display:block}.drawer h2{margin-top:0}.close{border:0;background:none;font-size:26px;cursor:pointer}.row{padding:12px 0;border-bottom:1px solid var(--line)}@media(max-width:600px){.top{padding:0 4%}.hero,.section{padding-right:5%;padding-left:5%}.search{flex-direction:column}.search button{padding:14px}}
</style></head>
<body>
<header class="top"><div class="brand"><b>س</b>السلة الذكية</div><div><button class="account-btn" onclick="alert('تسجيل الدخول متاح من حسابك السابق بعد استقرار النسخة.')">👤 حسابي</button> <button class="cart-btn" onclick="openCart()">🛒 السلة <span id="count">0</span></button></div></header>
<main><section class="hero"><h1>تسوّق من الصين بسهولة</h1><p>الصق رابط المنتج من 1688 أو تاو باو أو بن دودو، وسنحاول جلب بياناته وعرضه لك.</p><div class="search"><input id="url" placeholder="الصق رابط المنتج هنا"><button onclick="loadProduct()">عرض المنتج</button></div><div class="hint">يمكنك لصق النص كاملًا حتى لو فيه كلام بجانب الرابط.</div></section><section class="section"><h2 id="title">المنتجات</h2><p class="status" id="status">الصق رابط منتج للبدء.</p><div id="grid" class="grid"><div class="empty">بانتظار رابط منتج.</div></div></section></main>
<aside id="drawer" class="drawer"><button class="close" onclick="closeCart()">×</button><h2>سلة المشتريات</h2><div id="items"><p>السلة فارغة.</p></div></aside>
<script>let cart=[];function money(n){return (Number(n||0)*.82).toFixed(2)+' د.ل'}function openCart(){drawer.classList.add('open')}function closeCart(){drawer.classList.remove('open')}function renderCart(){count.textContent=cart.length;items.innerHTML=cart.length?cart.map((p,i)=>'<div class="row"><b>'+p.title+'</b><br><small>'+p.source+' · ¥'+p.price+'</small><br><strong>'+money(p.price)+'</strong><br><button onclick="cart.splice('+i+',1);renderCart()">حذف</button></div>').join(''):'<p>السلة فارغة.</p>'}async function loadProduct(){let raw=url.value.trim();let link=((raw.match(/(?:https?:\/\/|www\.)[^\s<>"'،]+/i)||[])[0]||raw).replace(/[)\]}>.,؛،]+$/,'');if(link.startsWith('www.'))link='https://'+link;if(!/^https?:\/\//i.test(link)){status.textContent='الصق رابطًا صحيحًا من 1688 أو تاو باو أو بن دودو.';return}status.textContent='جاري جلب بيانات المنتج…';title.textContent='جاري التحميل';grid.innerHTML='<div class="empty">نحمّل بيانات المنتج.</div>';try{let r=await fetch('/api/product?url='+encodeURIComponent(link)),d=await r.json();if(!r.ok||!d.success)throw Error(d.error||'تعذر جلب المنتج');let p={title:d.title||'منتج من الصين',source:d.platform||'1688',price:d.price||0,image:d.images&&d.images[0]};title.textContent='نتيجة المنتج';status.textContent='تم جلب المنتج من '+p.source;grid.innerHTML='<article class="card"><div class="image">'+(p.image?'<img src="/api/image?url='+encodeURIComponent(p.image)+'">':'📦')+'</div><div class="body"><div class="source">'+p.source+'</div><h3>'+p.title+'</h3><div class="price">'+money(p.price)+'</div><small>¥'+p.price+' قبل التحويل</small><button class="add" id="add">أضف للسلة</button></div></article>';document.getElementById('add').onclick=()=>{cart.push(p);renderCart();openCart()}}catch(e){title.textContent='تعذر جلب المنتج';status.textContent='حدث خطأ: '+(e.message||'حاول برابط آخر');grid.innerHTML='<div class="empty">تعذر جلب بيانات المنتج. تأكد من الرابط وحاول مرة أخرى.</div>'}}</script>
</body></html>
